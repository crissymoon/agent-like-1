<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://xcaliburmoon.net; connect-src 'self'; base-uri 'self'; form-action 'none'">
    <title>XCM Articles</title>
    <link rel="icon" type="image/webp" href="https://xcaliburmoon.net/new_design_imgs/xcalibur-full-cat.webp">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #251e18;
            background: #fdfcfc;
            line-height: 1.6;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        body.dark {
            background: #14100c;
            color: #e8d8b8;
        }

        /* --- Header --- */
        .page-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fdfcfc;
            border-bottom: 2px solid #fa7000;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: background 0.3s, border-color 0.3s;
        }
        body.dark .page-header {
            background: #14100c;
            border-bottom-color: #fa7000;
        }
        .top-back-link {
            font-size: 0.72rem;
            color: #fa7000;
            text-decoration: none;
            display: block;
            line-height: 1.2;
        }
        .top-back-link:hover { text-decoration: underline; }
        body.dark .top-back-link { color: #fa7000; }
        .page-logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fa7000;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .page-logo-sub {
            font-weight: 400;
            font-size: 0.75rem;
            color: #7a6040;
            letter-spacing: 0.02em;
            margin-left: 4px;
        }
        body.dark .page-logo-sub { color: #b8a87a; }
        .header-spacer { flex: 1; }
        .search-wrap {
            position: relative;
            flex: 0 1 340px;
        }
        .search-input {
            width: 100%;
            padding: 9px 14px 9px 36px;
            border: 1px solid #c8b898;
            border-radius: 0;
            font-size: 0.88rem;
            background: #fdfcfc;
            color: #251e18;
            outline: none;
            transition: border-color 0.2s, background 0.3s, color 0.3s;
        }
        body.dark .search-input {
            background: #1a1208;
            color: #e8d8b8;
            border-color: #4a3820;
        }
        .search-input:focus { border-color: #fa7000; }
        .search-input::placeholder { color: #b8a890; }
        body.dark .search-input::placeholder { color: #6a5a40; }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #7a6040;
            font-size: 0.9rem;
            pointer-events: none;
        }
        body.dark .search-icon { color: #b8a87a; }

        .mode-btn {
            background: #fa7000;
            color: #1a1208;
            border: none;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            border-radius: 0;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .mode-btn:hover { opacity: 0.85; }

        /* --- Stats --- */
        .stats-bar {
            padding: 10px 32px;
            font-size: 0.82rem;
            color: #7a6040;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        body.dark .stats-bar { color: #b8a87a; }
        .stats-bar .clear-recents {
            background: none;
            border: 1px solid #c8b898;
            color: #7a6040;
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 0;
            transition: border-color 0.2s, color 0.2s;
        }
        body.dark .clear-recents { border-color: #4a3820; color: #b8a87a; }
        .clear-recents:hover { border-color: #fa7000; color: #fa7000; }

        /* --- Recents row --- */
        .recents-section {
            padding: 0 32px 12px;
            display: none;
        }
        .recents-section.has-recents { display: block; }
        .recents-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #7a6040;
            margin-bottom: 8px;
        }
        body.dark .recents-label { color: #b8a87a; }
        .recents-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .recents-chip {
            flex-shrink: 0;
            background: #f0ece4;
            color: #251e18;
            padding: 6px 14px;
            font-size: 0.82rem;
            cursor: pointer;
            border-radius: 0;
            transition: background 0.2s;
            white-space: nowrap;
            border: 1px solid #c8b898;
        }
        body.dark .recents-chip {
            background: #251e18;
            color: #e8d8b8;
            border-color: #4a3820;
        }
        .recents-chip:hover { background: #fa7000; color: #1a1208; }
        .recents-more-btn {
            background: none;
            border: 1px solid #c8b898;
            color: #7a6040;
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 0;
            transition: border-color 0.2s, color 0.2s;
        }
        body.dark .recents-more-btn { border-color: #4a3820; color: #b8a87a; }
        .recents-more-btn:hover { border-color: #fa7000; color: #fa7000; }
        .recents-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            z-index: 200;
            background: #fdfcfc;
            border: 1px solid #c8b898;
            min-width: 220px;
            max-width: 300px;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        body.dark .recents-dropdown {
            background: #1a1208;
            border-color: #4a3820;
        }
        .recents-dropdown.open { display: block; }
        .recents-dropdown-item {
            padding: 8px 14px;
            font-size: 0.82rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s;
        }
        .recents-dropdown-item:hover { background: #f0ece4; }
        body.dark .recents-dropdown-item:hover { background: #251e18; }
        .recents-dropdown-wrap {
            position: relative;
            display: inline-block;
        }

        /* --- Grid --- */
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 0 32px 60px;
        }
        @media (max-width: 900px) {
            .articles-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .articles-grid { grid-template-columns: 1fr; padding: 0 16px 40px; gap: 14px; }
            .page-header { padding: 12px 16px; flex-wrap: wrap; }
            .search-wrap { flex: 1 1 100%; order: 3; }
            .stats-bar { padding: 8px 16px; flex-direction: column; align-items: flex-start; }
            .recents-section { padding: 0 16px 10px; }
        }

        .article-card {
            background: #fdfcfc;
            border: 1px solid #c8b898;
            padding: 20px;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
            display: flex;
            flex-direction: column;
        }
        body.dark .article-card {
            background: #1a1208;
            border-color: #3a2a14;
        }
        .article-card:hover {
            border-color: #fa7000;
            box-shadow: 0 2px 12px rgba(250, 112, 0, 0.12);
        }
        body.dark .article-card:hover {
            box-shadow: 0 2px 12px rgba(250, 112, 0, 0.2);
        }
        .article-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1208;
            margin-bottom: 6px;
            line-height: 1.3;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        body.dark .article-title { color: #fa7000; }
        .article-meta {
            font-size: 0.76rem;
            color: #7a6040;
            margin-bottom: 8px;
            overflow-wrap: break-word;
        }
        body.dark .article-meta { color: #b8a87a; }
        .article-desc {
            font-size: 0.88rem;
            color: #251e18;
            line-height: 1.55;
            flex: 1;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        body.dark .article-desc { color: #e8d8b8; }
        .article-tags {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .article-tag {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: #f0ece4;
            color: #5a4a30;
            border-radius: 0;
        }
        body.dark .article-tag {
            background: #251e18;
            color: #b8986a;
        }

        /* --- Sentinel / loader --- */
        .sentinel {
            height: 1px;
            width: 100%;
        }
        .loader-msg {
            text-align: center;
            padding: 24px;
            color: #7a6040;
            font-size: 0.85rem;
        }
        body.dark .loader-msg { color: #b8a87a; }
        .loader-msg.done { display: none; }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #7a6040;
            font-size: 1rem;
        }
        body.dark .no-results { color: #b8a87a; }

        /* --- Empty state --- */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #7a6040;
        }
        body.dark .empty-state { color: #b8a87a; }
        .empty-state h2 {
            font-size: 1.4rem;
            color: #fa7000;
            margin-bottom: 8px;
        }

        /* --- Footer notice --- */
        .page-footer {
            text-align: center;
            padding: 24px 32px 32px;
            font-size: 0.78rem;
            color: #7a6040;
            border-top: 1px solid #c8b898;
            margin-top: 20px;
        }
        body.dark .page-footer {
            color: #b8a87a;
            border-top-color: #3a2a14;
        }
        .page-footer a {
            color: #fa7000;
            text-decoration: underline;
            cursor: pointer;
        }
        body.dark .page-footer a { color: #ff9040; }
    </style>
</head>
<body>

<header class="page-header">
    <div>
        <a class="top-back-link" href="https://xcaliburmoon.net/" target="_blank" rel="noopener noreferrer">https://xcaliburmoon.net/</a>
        <span class="page-logo">XCM Articles</span>
        <span class="page-logo-sub">/public</span>
    </div>
    <div class="header-spacer"></div>
    <div class="search-wrap">
        <span class="search-icon">&#x1F50D;</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Fuzzy search articles..." autocomplete="off" spellcheck="false">
    </div>
    <button class="mode-btn" id="modeToggle">Toggle Theme</button>
</header>

<div class="stats-bar">
    <span id="statsCount">0 articles</span>
    <button class="clear-recents" id="clearRecents">Clear Recents</button>
</div>

<div class="recents-section" id="recentsSection">
    <div class="recents-label">Recently Viewed</div>
    <div class="recents-row" id="recentsRow">
        <div class="recents-dropdown-wrap" id="recentsDropdownWrap" style="display:none;">
            <button class="recents-more-btn" id="recentsMoreBtn">Show more</button>
            <div class="recents-dropdown" id="recentsDropdown"></div>
        </div>
    </div>
</div>

<div class="articles-grid" id="articlesGrid"></div>
<div class="sentinel" id="sentinel"></div>
<div class="loader-msg" id="loaderMsg">Loading...</div>

<div class="page-footer">
    This page tracks only visits, article clicks, and browser provider. No sensitive information is collected.
    <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
    
    <div style="margin-top: 15px;">
        &copy; 2026 <a href="https://xcaliburmoon.net/" target="_blank" rel="noopener">XcaliburMoon</a>. All rights reserved.
    </div>
    
</div>

    <script src="assets/articles.js" defer></script>
</body>
</html>
